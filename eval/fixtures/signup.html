<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title>
<style>body{font-family:sans-serif;padding:16px;background:#fff;color:#222}input,select{display:block;margin:8px 0}.hint{color:#999999}</style></head>
<body>
<main>
<h1>Create an account</h1>
<form>
<input type="text" name="name" placeholder="Full name">
<input type="email" name="email" placeholder="Email">
<label>Password <input type="password" name="pw"></label>
<select name="country"><option>USA</option><option>Canada</option></select>
<label for="missing">Newsletter</label>
<input type="checkbox" name="news">
<p class="hint">We never share your email.</p>
<button type="submit"></button>
</form>
</main>
</body>
</html>
